 const k=key(S.open), d=S.drafts[k]||'';
 const err=S.popErr?'<p class="cmp__err" role="alert">'+S.popErr+'</p>':'';
 const voice=S.voice?'<div class="voice"><i></i>Слушаю…</div>':'';
 const was=!!$('.pop');
 ov.innerHTML='<div class="pop'+(was?'':' is-in')+'" role="dialog" aria-label="Замечание к '+name+'"><span class="pop__arrow"></span>'+
 '<div class="pop__h"><b>'+name+'</b><span title="'+src+'">'+src.split('/').pop()+'</span><button class="ib" data-act="pclose" title="Закрыть (Esc), черновик сохранится">'+ICONS.x+'</button></div>'+hist+
 '<div class="cmp"><textarea aria-label="Замечание" placeholder="Что не так с '+name+'?">'+esc(d)+'</textarea>'+voice+err+
 '<div class="cmp__bar"><button class="ib" title="Держите ⌥ и говорите">'+ICONS.mic+'</button><span class="cmp__hint"><kbd>Enter</kbd> отправить <kbd>⌥</kbd> голос</span><button class="btn btn--pri" data-act="psend">Отправить</button></div></div></div>';
 const ta=$('.pop textarea');
 ta.oninput=()=>{S.drafts[k]=ta.value;if(S.popErr){S.popErr=null}};
 ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();psend()}};
}
function psend(){
 const k=key(S.open),txt=(S.drafts[k]||'').trim();
 if(!txt){S.popErr='Напишите, что не так, или скажите голосом (держите ⌥)';renderPop();placePop();$('.pop textarea').focus();return}
 if(S.failNext){S.popErr='Не сохранилось: сервер замечаний не ответил. Текст на месте — нажмите «Отправить» ещё раз.';renderPop();placePop();return}
 const t={id:'n'+Date.now(),screen:S.open.screen,k:S.open.k,text:txt,st:'sending',at:'сейчас',notes:[]};
 DB.unshift(t);S.drafts[k]='';S.popErr=null;render();
 setTimeout(()=>{t.st='waiting';render();toast('Отправлено агенту');const ta=$('.pop textarea');ta&&ta.focus()},800);
}
// ----- элементы списка -----
function itemEl(t,o){
 const [c]=comp(t.k);
 const where=o.where?'<span class="th__c">'+scT(t.screen)+' · '+c+'</span>':(o.comp?'<span class="th__c">'+c+'</span>':'');
 const rep=t.reply?'<div class="reply"><div class="reply__h"><b>Агент</b> · '+t.reply.at+'</div><p>'+esc(t.reply.text)+'</p><div class="reply__f" title="'+t.reply.files.join('\n')+'">'+t.reply.files.map(f=>f.split('/').pop()).join(', ')+' · '+t.reply.commit+'</div></div>':'';
 const notes=t.notes.map(n=>'<p class="note"><b>Вы</b> вернули агенту'+(n?': '+esc(n):'')+'</p>').join('');
 let acts='';
 if(S.reason===t.id) acts='<div class="why"><input aria-label="Причина" placeholder="Что осталось? Можно не писать"><div><button class="btn btn--pri" data-act="rsend" data-id="'+t.id+'">Вернуть агенту</button><button class="btn btn--ghost" data-act="rcancel">Отмена</button></div></div>';
 else if(t.st==='review') acts='<div class="acts"><button class="btn btn--pri" data-act="accept" data-id="'+t.id+'" title="Исправлено (A)">Принять</button><button class="btn btn--ghost" data-act="reject" data-id="'+t.id+'" title="Вернуть агенту (N)">Не исправлено</button></div>';
 else if(t.st==='done') acts='<div class="acts"><button class="btn btn--ghost" data-act="reject" data-id="'+t.id+'">Открыть снова</button></div>';
 const st={review:'check',waiting:'wait',done:'fixed',sending:'sending'}[t.st];
 return '<article class="th'+(S.active===t.id?' is-active':'')+'" data-id="'+t.id+'"'+(o.goto?' data-goto="'+t.id+'"':'')+' data-k-hover="'+t.k+'"><div class="th__top">'+statusEl(st)+where+'<time>'+t.at+'</time></div><p class="th__txt">'+esc(t.text)+'</p>'+rep+notes+acts+'</article>';
}
function groupsOf(list,o){
 const g=(h,l,ex)=>l.length?'<section class="grp"><div class="grp__h"><b>'+h+'</b>'+(ex||'')+'</div>'+l.map(t=>itemEl(t,o)).join('')+'</section>':'';
 const done=list.filter(t=>t.st==='done');
 return g('Проверьте',list.filter(t=>t.st==='review'),'<span>агент ответил</span>')+g('Ждут агента',list.filter(t=>t.st==='waiting'||t.st==='sending'))+
  (done.length?(S.showDone?g('Исправлено',done):'<button class="more" data-act="showdone">Исправлено · '+done.length+'</button>'):'');
}
function visibleAll(){const q=S.filter.q.trim().toLowerCase();return DB.filter(t=>(S.filter.screen==='all'||t.screen===S.filter.screen)&&(!q||(t.text+' '+comp(t.k)[0]+' '+scT(t.screen)).toLowerCase().includes(q)))}
function allList(){const l=visibleAll();return l.length?groupsOf(l,{where:true,goto:true}):'<div class="empty"><b>Ничего не нашлось</b>Смените экран в фильтре или очистите поиск.</div>'}
function counts(l){return {r:l.filter(t=>t.st==='review').length,w:l.filter(t=>t.st==='waiting'||t.st==='sending').length,d:l.filter(t=>t.st==='done').length}}
function renderPanel(){
 const p=$('.panel');
 if(S.all){
  const c=counts(DB);
  const opts=SCREENS.filter(s=>DB.some(t=>t.screen===s[0])).map(s=>'<option value="'+s[0]+'"'+(S.filter.screen===s[0]?' selected':'')+'>'+s[1]+' · '+DB.filter(t=>t.screen===s[0]&&t.st!=='done').length+'</option>').join('');
  p.innerHTML='<div class="ph"><div class="ph__row"><div class="ph__t"><h2>Все замечания</h2><p class="sum"><span class="st st--check">Проверить: '+c.r+'</span><span class="st st--wait">Ждут: '+c.w+'</span><span class="st st--fixed">Исправлено: '+c.d+'</span></p></div><button class="ib" data-act="allclose" title="Закрыть (⇧C)">'+ICONS.x+'</button></div></div>'+
  '<div class="flt"><select aria-label="Экран"><option value="all">Все экраны</option>'+opts+'</select><input aria-label="Поиск" placeholder="Текст, экран, компонент" value="'+esc(S.filter.q)+'"></div>'+
  '<div class="pb" style="border-top:1px solid var(--border)">'+allList()+'</div><div class="foot" style="padding:12px 16px;border-top:1px solid var(--border);font-size:12px;color:var(--faint);display:flex;gap:12px;flex-wrap:wrap"><span><kbd>J</kbd> <kbd>K</kbd> следующее</span><span><kbd>A</kbd> принять</span><span><kbd>N</kbd> не исправлено</span></div>';
  p.querySelector('select').onchange=e=>{S.filter.screen=e.target.value;p.querySelector('.pb').innerHTML=allList()};
  p.querySelector('.flt input').oninput=e=>{S.filter.q=e.target.value;p.querySelector('.pb').innerHTML=allList()};
  return;
 }
 if(!S.focus){p.innerHTML='';return}
 const sc=SCREENS[idx(S.focus)], mine=DB.filter(t=>t.screen===S.focus), c=counts(mine);
 const dr=Object.entries(S.drafts).filter(([k,v])=>v.trim()&&k.startsWith(S.focus+':')&&!(S.open&&key(S.open)===k));
 const drafts=dr.length?'<section class="grp"><div class="grp__h"><b>Черновики</b></div><div class="drafts">'+dr.map(([k,v])=>{const kk=k.split(':')[1];return '<button data-act="draft" data-k="'+kk+'"><b>'+comp(kk)[0]+'</b><span>'+esc(v)+'</span></button>'}).join('')+'</div></section>':'';
 p.innerHTML=head(sc)+tabs(c.r+c.w)+'<div class="pb">'+drafts+(mine.length?groupsOf(mine,{comp:true}):'<div class="empty"><b>Замечаний к экрану нет</b>Нажмите на компонент на экране — поле появится рядом с ним.</div>')+
 '<button class="btn" style="align-self:flex-start" data-act="all">Все замечания карты <kbd>⇧C</kbd></button></div>';
}
function pins(){
 $$('.pin').forEach(p=>p.remove());$$('.is-target').forEach(e=>e.classList.remove('is-target'));
 $$('.scr').forEach(scr=>{
  const id=scr.dataset.id,mine=DB.filter(t=>t.screen===id),open=mine.filter(t=>t.st!=='done').length;
  scr.querySelector('.cnt').textContent=open?open+' открыто':'';
  const byK={};mine.forEach(t=>{if(!byK[t.k]||RANK[t.st]<RANK[byK[t.k]])byK[t.k]=t.st});
  Object.entries(S.drafts).forEach(([k,v])=>{const [s,kk]=k.split(':');if(s===id&&v.trim())byK[kk]=byK[kk]||'draft'});
  Object.entries(byK).forEach(([k,st])=>{const el=scr.querySelector('[data-k="'+k+'"]');if(!el)return;const p=document.createElement('mark');
   p.className='pin pin--'+({review:'check',waiting:'wait',sending:'wait',done:'fixed',draft:'draft'}[st]);p.title=st==='draft'?'Черновик':'Замечания';
   p.onclick=ev=>{ev.stopPropagation();openPop(id,k)};el.appendChild(p)});
 });
 if(S.open){const el=$('.scr[data-id="'+S.open.screen+'"] [data-k="'+S.open.k+'"]');el&&el.classList.add('is-target')}
}
function topCount(){const r=counts(DB).r;const b=$('[data-act="all"].tbtn');if(b)b.innerHTML='Замечания'+(r?'<span class="cnt-b" title="Ждут вашей проверки">'+r+'</span>':'');if(b)b.classList.toggle('on',S.all)}
function render(){
 if(S.open&&S.open.screen!==S.focus){const d=(S.drafts[key(S.open)]||'').trim(),c=comp(S.open.k)[0];S.open=null;S.voice=false;if(d)setTimeout(()=>toast('Черновик к '+c+' сохранён'),0)}
 const fc=S._lf!==S.focus;S._lf=S.focus;
 document.body.classList.toggle('focus',!!S.focus);
 document.body.classList.toggle('pick',!!S.focus&&S.mode==='pick');
 document.body.classList.toggle('panel-on',!!S.focus||S.all);
 document.documentElement.style.setProperty('--panel',panelW()+'px');
 $$('.scr').forEach(s=>s.classList.toggle('is-focus',s.dataset.id===S.focus));
 pins();renderPanel();$('.under').innerHTML=S.focus?under():'';bind();renderPop();topCount();
 if(fc||S._lw!==panelW()){S._lw=panelW();camera()}else afterCam();
}
function gotoItem(id){
 const t=DB.find(x=>x.id===id);if(!t)return;S.active=id;
 const same=S.focus===t.screen;S.focus=t.screen;render();
 setTimeout(()=>flash(t.k),same?50:520);
 const el=$('.panel [data-id="'+id+'"]');el&&el.scrollIntoView({block:'nearest'});
}
function act(a,b){
 const t=b.dataset.id&&DB.find(x=>x.id===b.dataset.id);
 switch(a){
  case 'accept':t.st='done';t.notes=t.notes||[];if(S.active===t.id)nextActive();render();toast('Принято: исправлено');break;
  case 'reject':S.reason=t.id;render();setTimeout(()=>$('.why input')?.focus(),20);break;
  case 'rsend':{const v=($('.why input')||{}).value||'';t.st='waiting';t.notes.push(v.trim());S.reason=null;render();toast('Вернул агенту');break}
  case 'rcancel':S.reason=null;render();break;
  case 'showdone':S.showDone=true;render();break;
  case 'expand':S.expand=true;renderPop();placePop();break;
  case 'pclose':closePop(false);break;
  case 'psend':psend();break;
  case 'all':S.all=!S.all;render();break;
  case 'allclose':S.all=false;render();break;
  case 'draft':openPop(S.focus,b.dataset.k);break;
 }
}
function nextActive(){const l=[...$$('.panel [data-goto]')].map(e=>e.dataset.goto);const i=l.indexOf(S.active);S.active=l[i+1]||null}
function bootstrap(){
 build();
 $('.top .sp').insertAdjacentHTML('beforebegin','<button class="tbtn" data-act="all" title="Все замечания карты (⇧C)">Замечания</button>');
 $('.proto').innerHTML='<span style="padding:0 6px">Прототип:</span><button data-p="reply">Агент ответил на одно</button><button data-p="fail">Сбой при отправке: выкл</button><button data-p="reset">Сбросить</button><button data-p="theme">Тема (T)</button>';
 $$('.proto [data-p]').forEach(b=>b.onclick=()=>{const p=b.dataset.p;
  if(p==='reply'){const t=DB.find(x=>x.st==='waiting');if(t){t.st='review';t.reply={text:'Поправил, проверил на 360 и 390.',files:['apps/miniapp/src/'+comp(t.k)[1]],commit:'e4c1b07',at:'сейчас'};render();toast('Агент ответил: '+comp(t.k)[0])}}
  if(p==='fail'){S.failNext=!S.failNext;b.textContent='Сбой при отправке: '+(S.failNext?'вкл':'выкл');b.classList.toggle('on',S.failNext)}
  if(p==='reset'){DB=JSON.parse(JSON.stringify(DB0));S.drafts={};S.open=null;S.reason=null;render()}
  if(p==='theme')document.documentElement.classList.toggle('light')});
 document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!['send','close','copy','untarget','pick','accept-old'].includes(b.dataset.act)&&act.length){if(['accept','reject','rsend','rcancel','showdone','expand','pclose','psend','all','allclose','draft'].includes(b.dataset.act)){e.stopPropagation();act(b.dataset.act,b);return}}
  const g=e.target.closest('[data-goto]');if(g&&!e.target.closest('button,input'))gotoItem(g.dataset.goto)},true);
 // перетаскивание и колесо
 const stage=$('.stage');let drag=null;
 stage.addEventListener('mousedown',e=>{if(e.target.closest('.scr,.pop,.under'))return;drag={x:e.clientX,y:e.clientY,c:{...S.cam}};stage.classList.add('drag')});
 window.addEventListener('mousemove',e=>{if(!drag)return;setCam({x:drag.c.x+e.clientX-drag.x,y:drag.c.y+e.clientY-drag.y,s:drag.c.s},false)});
 window.addEventListener('mouseup',()=>{drag=null;stage.classList.remove('drag')});
 stage.addEventListener('wheel',e=>{if(e.target.closest('.pop'))return;e.preventDefault();const c=S.cam;
  if(e.ctrlKey||e.metaKey){const st=stage.getBoundingClientRect(),mx=e.clientX-st.left,my=e.clientY-st.top,s2=Math.max(.1,Math.min(2,c.s*Math.exp(-e.deltaY*.003)));setCam({x:mx-(mx-c.x)*s2/c.s,y:my-(my-c.y)*s2/c.s,s:s2},false)}
  else setCam({x:c.x-e.deltaX,y:c.y-e.deltaY,s:c.s},false)},{passive:false});
 document.addEventListener('keydown',e=>{
  const typing=e.target.matches('textarea,input,select');
  if(e.key==='Escape'){if(S.reason){S.reason=null;render()}else if(S.open)closePop(false);else if(S.all){S.all=false;render()}else if(S.focus){S.focus=null;render()}return}
  if(e.key==='Alt'&&e.target.matches('.pop textarea')&&!e.repeat){e.preventDefault();S.voice=true;renderPop();placePop();$('.pop textarea').focus();return}
  if(e.key==='Enter'&&e.target.matches('.why input')){e.preventDefault();act('rsend',{dataset:{id:S.reason}});return}
  if(typing)return;
  const k=e.key.toLowerCase();
  if(e.shiftKey&&(k==='c'||k==='с')){S.all=!S.all;render();return}
  if((k==='c'||k==='с')&&S.focus){S.mode='pick';render()}
  if((k==='i'||k==='ш')&&S.focus){S.mode='use';render()}
  if(k==='t'||k==='е')document.documentElement.classList.toggle('light');
  if((e.key==='['||e.key===']')&&S.focus){const i=idx(S.focus);S.focus=SCREENS[(i+(e.key===']'?1:7))%8][0];render()}
  if(S.all&&(k==='j'||k==='о'||k==='k'||k==='л')){const l=[...$$('.panel [data-goto]')].map(x=>x.dataset.goto);if(!l.length)return;const i=l.indexOf(S.active);gotoItem(l[(k==='j'||k==='о')?Math.min(l.length-1,i+1):Math.max(0,i-1)])}
  if(S.all&&S.active&&(k==='a'||k==='ф')){const t=DB.find(x=>x.id===S.active);if(t&&t.st==='review')act('accept',{dataset:{id:t.id}})}
  if(S.all&&S.active&&(k==='n'||k==='т')){const t=DB.find(x=>x.id===S.active);if(t&&t.st!=='waiting')act('reject',{dataset:{id:t.id}})}
 });
 document.addEventListener('keyup',e=>{if(e.key==='Alt'&&S.voice&&S.open){S.voice=false;const k=key(S.open);S.drafts[k]=((S.drafts[k]||'')+' цвет статуса почти не виден').trim();renderPop();placePop();$('.pop textarea').focus()}});
 window.addEventListener('resize',()=>camera());
 S.focus='applications';render();
}

bootstrap();</script>
</body></html>
