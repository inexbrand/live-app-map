 let edges='<svg class="edges" width="2600" height="2200">';
 [[0,1],[1,2],[1,4],[3,4],[0,6],[2,5],[6,7]].forEach(([a,b])=>{const p=pos(a),q=pos(b);edges+='<path d="M'+(p.x+W/2)+' '+(p.y+TITLE+H/2)+' C'+(p.x+W)+' '+(p.y+H)+','+(q.x)+' '+(q.y+100)+','+(q.x+W/2)+' '+(q.y+TITLE+H/2)+'"/>'});
 world.innerHTML=edges+'</svg>'+SCREENS.map(([id,t,p],i)=>{const o=pos(i);return '<div class="scr" data-id="'+id+'" style="left:'+o.x+'px;top:'+o.y+'px"><div class="scr__title">'+t+'<small>'+p+'</small><span class="cnt"></span></div><div class="scr__frame">'+app(t)+'</div></div>'}).join('');
 $$('.scr').forEach(el=>el.addEventListener('click',e=>{
  const id=el.dataset.id;
  if(S.focus!==id){S.focus=id;S.target=null;if(['draft','voice','error'].includes(S.view))S.view='empty';render();return;}
  if(S.mode!=='pick')return;
  const k=e.target.closest('[data-k]');
  if(k&&k.dataset.k){pickTarget(k.dataset.k)}
 }));
}
function pickTarget(k){S.list=S.list||S.view;S.target=k;S.view='draft';S.draft='';render();setTimeout(()=>{const ta=$('.cmp textarea');ta&&ta.focus()},30)}
function camera(){
 const st=$('.stage').getBoundingClientRect(),world=$('.world');
 if(!S.focus){const s=Math.min((st.width-80)/(4*W+3*GX),(st.height-80)/(2*(H+TITLE)+GY));world.style.transform='translate(40px,40px) scale('+s+')';return}
 const i=SCREENS.findIndex(x=>x[0]===S.focus),o=pos(i),pw=V.panel;
 const s=Math.min(1,(st.height-120)/(H+TITLE));
 const areaW=st.width-pw;
 const tx=areaW/2-(o.x+W/2)*s, ty=24-(o.y)*s;
 world.style.transform='translate('+tx+'px,'+ty+'px) scale('+s+')';
 const u=$('.under');u.style.left=areaW/2+'px';u.style.top=(24+(H+TITLE)*s+12)+'px';
}
function pins(){
 $$('.pin').forEach(p=>p.remove());$$('.is-target,.flash').forEach(e=>e.classList.remove('is-target','flash'));
 const scr=S.focus&&$('.scr[data-id="'+S.focus+'"]');
 $$('.scr').forEach(s=>s.querySelector('.cnt').textContent='');
 if(!scr)return;
 const th=threadsFor(S.list||S.view);
 const open=th.filter(t=>t.st!=='fixed').length; if(open) scr.querySelector('.cnt').textContent=open+' открыто';
 if(!V.pins)return;
 th.forEach(t=>{if(!t.k||t.st==='sending')return;const el=scr.querySelector('[data-k="'+t.k+'"]');if(!el)return;const p=document.createElement('mark');p.className='pin pin--'+t.st;p.title=t.text;p.onclick=ev=>{ev.stopPropagation();flash(t.k)};el.appendChild(p)});
 if(S.target){const el=scr.querySelector('[data-k="'+S.target+'"]');el&&el.classList.add('is-target')}
}
function flash(k){const scr=$('.scr.is-focus');if(!scr||!k)return;const el=scr.querySelector('[data-k="'+k+'"]');if(!el)return;el.classList.add('flash');clearTimeout(flash.t);flash.t=setTimeout(()=>el.classList.remove('flash'),1400)}
function toast(t){const e=$('.toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1600)}
function render(){
 document.body.classList.toggle('focus',!!S.focus);
 document.body.classList.toggle('pick',!!S.focus&&S.mode==='pick');
 $$('.scr').forEach(s=>s.classList.toggle('is-focus',s.dataset.id===S.focus));
 camera();pins();
 const sc=SCREENS.find(x=>x[0]===S.focus)||SCREENS[1];
 $('.panel').innerHTML=V.render(S,sc);
 $('.under').innerHTML=under();
 $$('.proto button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
 V.after&&V.after(S);
 bind();
}
function under(){
 const i=SCREENS.findIndex(x=>x[0]===S.focus),prev=SCREENS[(i+7)%8],next=SCREENS[(i+1)%8];
 return '<button class="navbtn" data-go="'+prev[0]+'" title="Предыдущий экран ([)">‹ '+prev[1]+'</button>'+
 '<span class="seg"><button data-mode="pick" class="'+(S.mode==='pick'?'on':'')+'" title="Наведите и нажмите на компонент (C)">Выбор компонента <kbd>C</kbd></button><button data-mode="use" class="'+(S.mode==='use'?'on':'')+'" title="Нажатия уходят в приложение (I)">Работа с приложением <kbd>I</kbd></button></span>'+
 '<button class="navbtn" data-go="'+next[0]+'" title="Следующий экран (])">'+next[1]+' ›</button>';
}
function send(){
 const ta=$('.cmp textarea');if(ta&&!ta.value.trim()){V.emptyError=true;render();return}
 V.emptyError=false;S.view='sending';S.list='sending';render();setTimeout(()=>{S.view='sent';S.list='sent';S.target=null;render();toast('Отправлено агенту')},900)
}
function bind(){
 $$('[data-go]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.focus=b.dataset.go;S.target=null;render()});
 $$('[data-mode]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.mode=b.dataset.mode;render()});
 $$('[data-act="close"]').forEach(b=>b.onclick=()=>{S.focus=null;S.target=null;render()});
 $$('[data-act="send"]').forEach(b=>b.onclick=send);
 $$('[data-act="untarget"]').forEach(b=>b.onclick=()=>{S.target=null;if(S.view==='draft')S.view='empty';render()});
 $$('[data-act="pick"]').forEach(b=>b.onclick=()=>{S.mode='pick';S.view='pick';render()});
 $$('[data-act="accept"]').forEach(b=>b.onclick=()=>{S.view='fixed';S.list='fixed';render();toast('Принято, замечание закрыто')});
 $$('[data-act="reopen"]').forEach(b=>b.onclick=()=>{S.target='card1';S.view='draft';render();toast('Опишите, что осталось — уйдёт ответом в ту же ветку')});
 $$('[data-act="copy"]').forEach(b=>b.onclick=()=>toast('Скопировано'));
 $$('[data-act="retry"]').forEach(b=>b.onclick=send);
 $$('[data-k-hover]').forEach(el=>{el.onmouseenter=()=>flash(el.dataset.kHover)});
 const ta=$('.cmp textarea');
 if(ta){ta.value=S.draft;ta.oninput=()=>{S.draft=ta.value};ta.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}}}
}
function statusEl(st){return {wait:'<span class="st st--wait">Ждёт агента</span>',check:'<span class="st st--check">Проверьте</span>',fixed:'<span class="st st--fixed">Исправлено</span>',sending:'<span class="st st--sending">Отправляю</span>'}[st]}
function threadEl(t,o={}){
 const r=t.reply&&t.st!=='wait'?'<div class="reply"><div class="reply__h"><b>Агент</b> · '+t.reply.at+'</div><p>'+esc(t.reply.text)+'</p><div class="reply__f">'+t.reply.files.map(f=>f.split('/').pop()).join(', ')+' · '+t.reply.commit+'</div></div>':'';
 const acts=t.st==='check'?'<div class="acts"><button class="btn" data-act="accept">Принять</button><button class="btn btn--ghost" data-act="reopen">Не исправлено</button><button class="ib" data-act="copy" title="Скопировать текст для агента">'+ICONS.copy+'</button></div>':'';
 return '<article class="th" data-k-hover="'+(t.k||'')+'"><div class="th__top">'+(o.noStatus?'':statusEl(t.st))+(o.noComp?'':'<span class="th__c">'+(t.c||'Экран целиком')+'</span>')+'<time>'+t.at+'</time></div><p class="th__txt">'+esc(t.text)+'</p>'+r+acts+'</article>';
}
function composerEl(o={}){
 const k=S.target, info=k?KEYS[k]:null;
 const tgt=o.noTarget?'':info?'<div class="cmp__target"><b>'+info[0]+'</b><span>'+info[1]+'</span><button class="ib" data-act="untarget" title="Убрать компонент — замечание к экрану целиком">'+ICONS.x+'</button></div>'
  :(o.noTarget?'':'<div class="cmp__target"><b>Экран целиком</b><span>или нажмите на компонент на экране</span></div>');
 const voice=S.view==='voice'?'<div class="voice"><i></i>Слушаю… «счётчик двенадцать налезает на подпись»</div>':'';
 const err=S.view==='error'?'<p class="cmp__err" role="alert">Не сохранилось: сервер замечаний не ответил. Текст на месте.</p>':(V.emptyError?'<p class="cmp__err" role="alert">Напишите, что не так, или скажите голосом (держите ⌥)</p>':'');
 const busy=S.view==='sending';
 const btn=S.view==='error'?'<button class="btn btn--pri" data-act="retry">Повторить</button>':'<button class="btn btn--pri" data-act="send" '+(busy?'disabled':'')+'>'+(busy?'Отправляю…':'Отправить')+'</button>';
 return '<div class="cmp">'+tgt+'<textarea placeholder="'+(info?'Что не так с '+info[0]+'?':'Что не так на экране?')+'" aria-label="Замечание"></textarea>'+voice+err+
 '<div class="cmp__bar"><button class="ib" title="Держите ⌥ и говорите">'+ICONS.mic+'</button><span class="cmp__hint"><kbd>Enter</kbd> отправить <kbd>⌥</kbd> голос</span>'+btn+'</div></div>';
}
function bootstrap(){
 document.documentElement.style.setProperty('--panel',V.panel+'px');
 build();
 $('.proto').innerHTML='<span style="padding:0 6px">Состояние прототипа:</span>'+STATES.map(([v,l])=>'<button data-v="'+v+'">'+l+'</button>').join('')+'<button data-theme>Тема (T)</button>';
 $$('.proto [data-v]').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;S.list=b.dataset.v;S.focus=S.focus||'applications';S.mode='pick';
  S.target=['draft','voice','error'].includes(S.view)?'filter':null;S.draft=['draft','error'].includes(S.view)?'Счётчик «12» налезает на подпись на ширине 360':'';render();
  if(S.view==='pick')setTimeout(()=>{const el=$('.scr.is-focus [data-k="card1"]');el&&el.classList.add('is-target')},50)});
 $('.proto [data-theme]').onclick=()=>document.documentElement.classList.toggle('light');
 document.addEventListener('keydown',e=>{
  const typing=e.target.matches('textarea,input');
  if(e.key==='Escape'){if(S.target||['draft','voice','error'].includes(S.view)){S.target=null;S.view='empty';render()}else if(S.focus){S.focus=null;render()}return}
  if(e.key==='Alt'&&typing&&!e.repeat){e.preventDefault();S.view='voice';render();setTimeout(()=>$('.cmp textarea')?.focus(),0);return}
  if(typing)return;
  const k=e.key.toLowerCase();
  if((k==='c'||k==='с')&&S.focus){S.mode='pick';render()}
  if((k==='i'||k==='ш')&&S.focus){S.mode='use';render()}
  if(k==='t'||k==='е')document.documentElement.classList.toggle('light');
  if((e.key==='['||e.key===']')&&S.focus){const i=SCREENS.findIndex(x=>x[0]===S.focus);S.focus=SCREENS[(i+(e.key===']'?1:7))%8][0];S.target=null;render()}
 });
 document.addEventListener('keyup',e=>{if(e.key==='Alt'&&S.view==='voice'){S.view='draft';S.draft='Счётчик двенадцать налезает на подпись';render();setTimeout(()=>$('.cmp textarea')?.focus(),0)}});
 window.addEventListener('resize',camera);
 S.focus='applications';render();
}


function head(sc,o={}){
 return '<div class="ph"><div class="ph__row"><div class="ph__t"><h2>'+sc[1]+'</h2><p><span class="live" title="Экран живой"></span>'+sc[2]+' · 390×844</p></div>'+
 '<button class="ib" title="Открыть во вкладке">'+ICONS.ext+'</button><button class="ib" data-act="copy" title="Копировать адрес">'+ICONS.copy+'</button><button class="ib" data-act="close" title="Закрыть (Esc)">'+ICONS.x+'</button></div>'+
 (o.roles===false?'':'<div class="seg" style="align-self:flex-start"><button class="on">Рекрутер</button><button>Клиент</button></div>')+'</div>';
}
function tabs(n){return '<div class="tabs"><button class="on">Замечания'+(n?'<i>'+n+'</i>':'')+'</button><button>Код</button><button>Лог</button></div>'}
function groups(th,o={}){
 const g=(h,list,extra='')=>list.length?'<section class="grp"><div class="grp__h"><b>'+h+'</b>'+extra+'</div>'+list.map(t=>threadEl(t,{...o,noStatus:!o.keepStatus})).join('')+'</section>':'';
 const fixed=th.filter(t=>t.st==='fixed');
 return g('Проверьте',th.filter(t=>t.st==='check'),'<span>агент ответил</span>')+g('Ждут агента',th.filter(t=>t.st==='wait'||t.st==='sending'))+
 (fixed.length?(V.showFixed?g('Исправлено',fixed):'<button class="more" data-act="fixed">Исправлено · '+fixed.length+'</button>'):'');
}

const V={panel:400,pins:true,showFixed:false,render(S,sc){
 const th=threadsFor(S.list||S.view),open=th.filter(t=>t.st!=='fixed').length;
 let body;
 if(!th.length){body=S.view==='pick'||S.mode==='pick'?'<div class="empty"><b>Замечаний к экрану нет</b>Наведите на компонент и нажмите на него — имя, файл и снимок подставятся сами. Без выбора замечание уйдёт к экрану целиком.</div>':'<div class="empty"><b>Замечаний к экрану нет</b>Нажмите <kbd>C</kbd>, чтобы выбрать компонент.</div>';
  }
 else body=groups(th);
 return head(sc)+tabs(open)+'<div class="pb">'+body+'</div><div class="foot">'+composerEl()+'</div>';
},after(){document.querySelectorAll('[data-act="fixed"]').forEach(b=>b.onclick=()=>{V.showFixed=true;render()})}};

bootstrap();</script>
</body></html>
