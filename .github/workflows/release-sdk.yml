# Релиз @live-app-map/sdk: тег sdk-v<версия> → tarball → GitHub Release с файлом.
# install.sh ставит в проект tarball последнего такого релиза.
# Выпуск: версия в packages/sdk/package.json = версия тега; git tag sdk-v0.1.0 && git push origin sdk-v0.1.0
name: release-sdk

on:
  push:
    tags:
      - 'sdk-v*'

permissions:
  contents: write

concurrency:
  group: release-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Зависимости
        run: bun install --frozen-lockfile

      - name: Версия тега совпадает с package.json
        id: version
        run: |
          tag_version="${GITHUB_REF_NAME#sdk-v}"
          pkg_version="$(bun -e 'console.log((await Bun.file("packages/sdk/package.json").json()).version)')"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::тег $GITHUB_REF_NAME, а в packages/sdk/package.json версия $pkg_version — поднимите версию и перевыпустите тег"
            exit 1
          fi
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"

      - name: Тесты сборки и установки
        run: bun test packages/sdk/scripts packages/cli/src/init.test.ts

      - name: Tarball
        run: bun run --cwd packages/sdk pack:tarball --out "$RUNNER_TEMP/sdk"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/sdk/live-app-map-sdk-$VERSION.tgz" \
            --verify-tag \
            --title "@live-app-map/sdk $VERSION" \
            --notes "Установка в проект: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/install.sh | bash"
